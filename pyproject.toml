[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "idc-ai-ops"
version = "0.3.0"
description = "Private IDC incident investigation and onsite collaboration workbench"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
idc-ai-ops = "idcops.server:main"

[tool.setuptools.packages.find]
include = ["idcops*"]
